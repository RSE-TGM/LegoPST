name: Build

# Compilazione da zero di LegoPST e controllo dei warning, poi prove di
# funzionamento, dentro l'immagine che ha gia' compilatori e header
# (aguagliardi/legopst:2.0). Gli script fanno tutto e si lanciano uguali a
# mano: .github/scripts/build_check.sh e .github/scripts/smoke_test.sh.
#
# - build: fallisce se ci sono errori, o se i warning superano la soglia in
#   .github/build_warnings_baseline (che puo' solo scendere);
# - prove: installano la demo "nuclear" con lgdemo, e su quella provano
#   lgmkstaz, kUpSim, una simulazione senza grafica che avanza 10 passi e la
#   mappa delle variabili. Girano solo se il build e' andato bene.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # una simulazione che non risponde non deve tenere fermo il runner fino al
    # limite di GitHub (6 ore): ogni prova ha il suo timeout, questo e' il tetto
    timeout-minutes: 45
    container:
      image: aguagliardi/legopst:2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da zero e controllo dei warning
        shell: bash
        run: bash .github/scripts/build_check.sh

      - name: Prove di funzionamento
        shell: bash
        timeout-minutes: 20
        env:
          # lgdemo legge la release con l'API di GitHub, che da' 60
          # interrogazioni l'ora a chi non si presenta: dai runner (indirizzi
          # condivisi) si esauriscono presto. Il token della run basta.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/smoke_test.sh

      - name: Log del build e delle prove
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            smoke-logs/
          retention-days: 14
          if-no-files-found: ignore
